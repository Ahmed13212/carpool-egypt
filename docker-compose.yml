# Local development services. NOTE: not executed in the authoring sandbox (no Docker available).
services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: carpool
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: carpool_dev
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U carpool -d carpool_dev"]
      interval: 5s
      retries: 10
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    profiles: ["future"] # not used yet: worker/BullMQ is not implemented
volumes:
  pgdata:
